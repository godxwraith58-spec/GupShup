<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GupShup Chat</title>
<style>
:root{--bg:#f2f4f8;--card:#ffffff;--ink:#1b1f2a;--mute:#7a8197;--line:#e3e6ef;--acc:#2f7df6;--acc2:#7a4ee0;--me:#2f7df6;--meT:#fff;--them:#ffffff;--themT:#1b1f2a;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1118;--card:#171b25;--ink:#eef0f7;--mute:#8e95ad;--line:#262b3a;--acc:#5b9bff;--me:#2f6fe0;--them:#1f2431;--themT:#eef0f7}}
:root[data-theme="dark"]{--bg:#0e1118;--card:#171b25;--ink:#eef0f7;--mute:#8e95ad;--line:#262b3a;--acc:#5b9bff;--me:#2f6fe0;--them:#1f2431;--themT:#eef0f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
.scr{position:fixed;inset:0;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);max-width:560px;margin:0 auto;background:var(--bg)}
.scr.on{display:flex}
.hd{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:800;font-size:18px}
.hd .sp{flex:1}.hd button{background:rgba(255,255,255,.2);border:0;border-radius:12px;color:#fff;padding:6px 12px;font-weight:700}
.body{flex:1;overflow:auto;padding:10px 12px}
.tabs{display:flex;background:var(--card);border-top:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:12px 4px;font-size:12px;font-weight:700;color:var(--mute)}
.tabs button.on{color:var(--acc)}.tabs b{display:block;font-size:20px;font-weight:400}
.li{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.li .t{flex:1;min-width:0}.li .t b{display:block}.li .t span{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.li small{color:var(--mute);font-size:11px}
.msgs{display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:8px 12px;border-radius:16px;word-wrap:break-word;white-space:pre-wrap;font-size:15px;line-height:1.35}
.m.me{align-self:flex-end;background:var(--me);color:var(--meT);border-bottom-right-radius:4px}
.m.th{align-self:flex-start;background:var(--them);color:var(--themT);border:1px solid var(--line);border-bottom-left-radius:4px}
.m .n{font-size:11px;font-weight:800;color:var(--acc);display:block;margin-bottom:2px}
.m .ts{font-size:10px;opacity:.7;display:block;text-align:right;margin-top:2px}
.in{display:flex;gap:8px;padding:8px 10px;background:var(--card);border-top:1px solid var(--line)}
.in input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:22px;padding:11px 16px;outline:0}
.in button,.pbtn{border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:22px;padding:0 18px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:auto 14px}
.card h2{margin:0 0 4px}.card p{color:var(--mute);margin:0 0 14px;font-size:14px}
.fld{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:13px;margin-bottom:10px;outline:0}
.pbtn{width:100%;padding:13px;margin-top:4px;border-radius:14px}
.alt{background:none!important;color:var(--acc)!important;margin-top:6px}
.err{color:#e5484d;font-size:13px;min-height:18px;margin-bottom:6px}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:6px}.seg button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px}.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.dev{text-align:center;color:var(--mute);font-size:12px;margin:14px 0}
.empty{text-align:center;color:var(--mute);margin-top:40px}
#ld{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#2f7df6,#7a4ee0);color:#fff;transition:opacity .5s}
#ld.hide{opacity:0;pointer-events:none}
#ld .lg{font-size:64px;animation:bob 1.3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-10px)}}
#ld h1{margin:8px 0 20px}.lb{width:min(70vw,280px);height:10px;border-radius:6px;background:rgba(255,255,255,.3);overflow:hidden}.lb i{display:block;height:100%;width:0;background:#fff;border-radius:6px;transition:width .1s}
#lp{margin-top:10px;font-weight:800;font-size:20px}
</style>
</head>
<body>
<div id="ld"><div class="lg">&#128172;</div><h1>GupShup</h1><div class="lb"><i id="lf"></i></div><div id="lp">0%</div></div>

<div class="scr" id="setup"><div class="card"><h2>Setup required</h2><p>Open this file, find <b>firebaseConfig</b> near the top of the script and paste your Firebase project values. Then upload the file again.</p></div></div>

<div class="scr" id="auth"><div class="card"><h2>&#128172; GupShup</h2><p>Login or create a new account</p>
<input class="fld" id="u" placeholder="Username (a-z, 0-9, _)" autocapitalize="none" autocomplete="username">
<input class="fld" id="p" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password">
<div class="err" id="ae"></div>
<button class="pbtn" id="bl">Login</button><button class="pbtn alt" id="bs">Create account</button>
<div class="dev">Developed by <b>GoDxWraith</b></div></div></div>

<div class="scr" id="main">
<div class="hd"><span id="mt">Chats</span><span class="sp"></span></div>
<div class="body" id="mb"></div>
<div class="tabs"><button data-t="chats" class="on"><b>&#128172;</b>Chats</button><button data-t="find"><b>&#128269;</b>Find</button><button data-t="room"><b>&#127760;</b>Public</button><button data-t="set"><b>&#9881;</b>Settings</button></div>
</div>

<div class="scr" id="chat">
<div class="hd"><button id="cb">&#8249; Back</button><span id="ct"></span></div>
<div class="body"><div class="msgs" id="mm"></div></div>
<div class="in"><input id="mi" placeholder="Type a message" autocomplete="off"><button id="ms">Send</button></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,collection,addDoc,query,where,orderBy,limitToLast,limit,onSnapshot,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== PASTE YOUR FIREBASE CONFIG HERE ====== */
const firebaseConfig={
 apiKey:"AIzaSyDvozeflTot5V9LOKmC70FsjrDCykmWOGo",
 authDomain:"gupshup-37856.firebaseapp.com",
 projectId:"gupshup-37856",
 storageBucket:"gupshup-37856.firebasestorage.app",
 messagingSenderId:"218942550217",
 appId:"1:218942550217:web:839b3d2340428a02019d18"
};
/* ============================================ */

const $=i=>document.getElementById(i),DOM="@gupshup.app";
let S={theme:"auto"};try{Object.assign(S,JSON.parse(localStorage.getItem("gs_set")||"{}"))}catch(e){}
const saveS=()=>{try{localStorage.setItem("gs_set",JSON.stringify(S))}catch(e){}};
function theme(){const r=document.documentElement;if(S.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.theme)}theme();
function show(id){document.querySelectorAll(".scr").forEach(s=>s.classList.remove("on"));$(id).classList.add("on")}
/* loading 0-100 */
(()=>{let p=0;const iv=setInterval(()=>{p=Math.min(100,p+1+Math.floor(Math.random()*5));$("lf").style.width=p+"%";$("lp").textContent=p+"%";if(p>=100){clearInterval(iv);setTimeout(()=>{$("ld").classList.add("hide");setTimeout(()=>$("ld").remove(),600)},300)}},70)})();

if(firebaseConfig.apiKey.startsWith("PASTE")){show("setup")}else{
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let me=null,myName="",tab="chats",unsubList=null,unsubMsg=null,cur=null;
const initial=n=>(n||"?")[0].toUpperCase(),fmt=t=>new Date(t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
const mk=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
const cid=(a,b)=>[a,b].sort().join("_");

/* auth */
function validU(u){return /^[a-z0-9_]{3,16}$/.test(u)}
async function doAuth(create){const u=$("u").value.trim().toLowerCase(),pw=$("p").value;$("ae").textContent="";
if(!validU(u)){$("ae").textContent="Username: 3-16 letters, numbers or _";return}
if(pw.length<6){$("ae").textContent="Password must be at least 6 characters";return}
try{if(create){const c=await createUserWithEmailAndPassword(auth,u+DOM,pw);await setDoc(doc(db,"users",c.user.uid),{name:u,nameLower:u,created:Date.now()})}else await signInWithEmailAndPassword(auth,u+DOM,pw)}
catch(e){const m=e.code||"";$("ae").textContent=m.includes("email-already")?"Username already taken":m.includes("invalid-credential")||m.includes("wrong-password")||m.includes("user-not-found")?"Wrong username or password":m.includes("network")?"No internet connection":m.includes("operation-not-allowed")?"Enable Email/Password in Firebase":"Error: "+m}}
$("bl").onclick=()=>doAuth(false);$("bs").onclick=()=>doAuth(true);
onAuthStateChanged(auth,u=>{me=u;if(unsubList){unsubList();unsubList=null}
if(!u){show("auth");return}
myName=(u.email||"").split("@")[0];show("main");setTab("chats")});

/* tabs */
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.t));
function setTab(t){tab=t;document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
$("mt").textContent={chats:"Chats",find:"Find people",room:"Public room",set:"Settings"}[t];
if(unsubList){unsubList();unsubList=null}
({chats:viewChats,find:viewFind,room:viewRoom,set:viewSet})[t]()}
function viewChats(){const b=$("mb");b.innerHTML="";b.appendChild(mk("div","empty","Loading..."));
unsubList=onSnapshot(query(collection(db,"chats"),where("members","array-contains",me.uid)),s=>{
const a=s.docs.map(d=>d.data()).sort((x,y)=>(y.lastTs||0)-(x.lastTs||0));b.innerHTML="";
if(!a.length){b.appendChild(mk("div","empty","No chats yet. Use Find to start one."));return}
a.forEach(c=>{const oid=c.members.find(x=>x!==me.uid),nm=(c.names||{})[oid]||"User",it=mk("div","li"),av=mk("div","av",initial(nm)),t=mk("div","t");
t.appendChild(mk("b","",nm));t.appendChild(mk("span","",c.last||""));it.append(av,t,mk("small","",c.lastTs?fmt(c.lastTs):""));it.onclick=()=>openChat(oid,nm);b.appendChild(it)})},
e=>{b.innerHTML="";b.appendChild(mk("div","empty","Could not load chats. Check Firestore rules."))})}
function viewFind(){const b=$("mb");b.innerHTML="";const i=mk("input","fld");i.placeholder="Search username";i.autocapitalize="none";const r=mk("div");b.append(i,r);let h;
i.oninput=()=>{clearTimeout(h);h=setTimeout(async()=>{const q=i.value.trim().toLowerCase();r.innerHTML="";if(q.length<2)return;
try{const s=await getDocs(query(collection(db,"users"),where("nameLower",">=",q),where("nameLower","<=",q+"\uf8ff"),limit(10)));let n=0;
s.forEach(d=>{if(d.id===me.uid)return;n++;const it=mk("div","li"),tt=mk("div","t");tt.appendChild(mk("b","",d.data().name));it.append(mk("div","av",initial(d.data().name)),tt);it.onclick=()=>openChat(d.id,d.data().name);r.appendChild(it)});
if(!n)r.appendChild(mk("div","empty","No user found"))}catch(e){r.appendChild(mk("div","empty","Search failed"))}},350)}}
function viewRoom(){$("mb").innerHTML="";const it=mk("div","li");it.append(mk("div","av","\u{1F310}"));const t=mk("div","t");t.append(mk("b","","Public room"),mk("span","","Chat with everyone"));it.appendChild(t);it.onclick=()=>openThread({title:"Public room",path:["rooms","global","messages"],room:true});$("mb").appendChild(it)}
function viewSet(){const b=$("mb");b.innerHTML="";
const r1=mk("div","row");r1.appendChild(mk("span","","Signed in as "+myName));
const r2=mk("div","row");r2.appendChild(mk("span","","Theme"));const sg=mk("div","seg");["auto","light","dark"].forEach(v=>{const x=mk("button",S.theme===v?"on":"",v);x.onclick=()=>{S.theme=v;saveS();theme();viewSet()};sg.appendChild(x)});r2.appendChild(sg);
const lo=mk("button","pbtn","Logout");lo.onclick=()=>signOut(auth);lo.style.marginTop="16px";
const dv=mk("div","dev");dv.innerHTML="Developed by <b>GoDxWraith</b>";b.append(r1,r2,lo,dv)}

/* chat */
function openChat(oid,nm){openThread({title:nm,path:["chats",cid(me.uid,oid),"messages"],oid,nm})}
function openThread(c){cur=c;$("ct").textContent=c.title;show("chat");const box=$("mm");box.innerHTML="";if(unsubMsg)unsubMsg();
unsubMsg=onSnapshot(query(collection(db,...c.path),orderBy("ts"),limitToLast(100)),s=>{box.innerHTML="";
s.forEach(d=>{const m=d.data(),mine=m.from===me.uid,e=mk("div","m "+(mine?"me":"th"));if(c.room&&!mine)e.appendChild(mk("span","n",m.name||"User"));e.appendChild(document.createTextNode(m.text));e.appendChild(mk("span","ts",fmt(m.ts)));box.appendChild(e)});
const bd=box.parentElement;bd.scrollTop=bd.scrollHeight},()=>{box.innerHTML="";box.appendChild(mk("div","empty","Could not load messages. Check Firestore rules."))})}
async function send(){const i=$("mi"),text=i.value.trim();if(!text||!cur)return;i.value="";const ts=Date.now();
try{if(!cur.room){await setDoc(doc(db,"chats",cid(me.uid,cur.oid)),{members:[me.uid,cur.oid],names:{[me.uid]:myName,[cur.oid]:cur.nm},last:text,lastTs:ts},{merge:true})}
await addDoc(collection(db,...cur.path),{text,from:me.uid,name:myName,ts})}catch(e){i.value=text;alert("Message not sent. Check internet and Firestore rules.")}}
$("ms").onclick=send;$("mi").addEventListener("keydown",e=>{if(e.key==="Enter")send()});
$("cb").onclick=()=>{if(unsubMsg){unsubMsg();unsubMsg=null}cur=null;show("main");setTab(tab)};
}
</script>
</body>
</html>
